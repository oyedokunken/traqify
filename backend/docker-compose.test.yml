# Disposable Postgres for the test suite. Port 5433 avoids clashing with a local Postgres on 5432.
#   docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_only_not_a_secret
      POSTGRES_DB: traqify_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d traqify_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Transaction-mode PgBouncer in front of the test database, the same pooling mode as the Supabase pooler on port 6543.
  #   docker compose -f docker-compose.test.yml --profile pooler up -d
  #   DATABASE_URL_TEST_POOLED=postgresql://test_user:test_only_not_a_secret@localhost:6433/traqify_test?pgbouncer=true&connection_limit=3
  pgbouncer-test:
    profiles: ["pooler"]
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DB_HOST: postgres-test
      DB_USER: test_user
      DB_PASSWORD: test_only_not_a_secret
      DB_NAME: traqify_test
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      DEFAULT_POOL_SIZE: "6"
      MAX_CLIENT_CONN: "100"
      # Supabase transaction mode does not support prepared statements, so neither does this pooler.
      MAX_PREPARED_STATEMENTS: "0"
      ADMIN_USERS: test_user
    ports:
      - "6433:5432"
