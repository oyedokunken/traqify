name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traqify
          POSTGRES_PASSWORD: traqify
          POSTGRES_DB: traqify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traqify -d traqify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test suite refuses to run unless the database name ends in _test.
      DATABASE_URL_TEST: postgresql://traqify:traqify@localhost:5432/traqify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          # Placeholders: the client is constructed at import time and needs a URL to build.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # Advisory only until the framework upgrade tracked in the audit report lands.
      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
